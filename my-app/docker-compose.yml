services:
  app:
    image: phonebook-front
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phonebook-frontend

  server:
    image: phonebook-back
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - MONGODB_URI=mongodb://mongo:27017/phonebook
      - PORT=3001
    depends_on:
      - mongo
    container_name: phonebook-backend

  mongo:
    image: mongo
    volumes:
      - mongo_data:/data/db

  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: phonebook-reverse-proxy
    depends_on:
      - app
      - server

volumes:
  mongo_data:
